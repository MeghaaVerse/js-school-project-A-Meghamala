<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moon Exploration Timeline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    nav.timeline {
      display: flex;
      justify-content: center;
      position: relative;
      margin-bottom: 50px;
    }

    nav.timeline::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 4px;
      background: #ccc;
      z-index: 0;
    }

    nav.timeline a {
      display: inline-block;
      width: 20px;
      height: 20px;
      background: white;
      border: 3px solid #007BFF;
      border-radius: 50%;
      margin: 0 25px;
      position: relative;
      z-index: 1;
      transition: background 0.3s, border-color 0.3s;
      text-decoration: none;
    }

    nav.timeline a:hover {
      background-color: #007BFF;
    }

    nav.timeline a::after {
      content: attr(title);
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 12px;
      color: #333;
    }

    section {
      max-width: 700px;
      margin: auto;
      margin-bottom: 50px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    figure {
      margin: 0;
    }

    img {
      max-width: 100%;
      border-radius: 10px;
    }

    figcaption {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }

    h2 {
      color: #007BFF;
    }
  </style>
</head>
